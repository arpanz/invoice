name: invoice
description: "Invoice Maker Pro - Generate professional GST-ready invoices in 60 seconds."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.1

  # File Handling
  path_provider: ^2.1.4
  share_plus: ^12.0.1

  # UI Polish
  google_fonts: ^8.0.2
  intl: ^0.20.2

  # Image Picker (for logo upload)
  image_picker: ^1.1.2

  # Shared Preferences (for settings)
  shared_preferences: ^2.3.3

  # UUID generation
  uuid: ^4.5.1

  # Ads (stub - real keys needed)
  google_mobile_ads: ^7.0.0

  # IAP
  in_app_purchase: ^3.2.0
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_foreground_inset: 12
  adaptive_icon_background: "#B2D8FC"
  adaptive_icon_foreground: "assets/icon.png"
  adaptive_icon_monochrome: "assets/icon.png"

flutter_native_splash:
  color: "#B2D8FC" 
  image: "assets/icon.png"
  android_12:
    image: "assets/icon.png"
    color: "#B2D8FC"
