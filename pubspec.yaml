name: invoice
description: "Invoice Maker Pro - Generate professional GST-ready invoices in 60 seconds."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.1

  # File Handling
  path_provider: ^2.1.4
  share_plus: ^12.0.1

  # UI Polish
  google_fonts: ^8.0.2
  intl: ^0.20.2

  # Image Picker (for logo upload)
  image_picker: ^1.1.2

  # Shared Preferences (for settings)
  shared_preferences: ^2.3.3

  # UUID generation
  uuid: ^4.5.1

  # IAP
  in_app_purchase: ^3.3.0
  change_app_package_name: ^1.5.0
  in_app_review: ^2.0.11
  in_app_update: ^4.2.5
  file_picker: ^11.0.3
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.1
  local_auth: ^3.0.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  sqflite_common_ffi: ^2.3.4+4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    # Built from assets/icons/*.svg by tool/build_icons.py
    - family: AppIcons
      fonts:
        - asset: assets/icon_font/AppIcons.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  # The foreground is drawn full-bleed with the subject already inside the
  # adaptive-icon safe zone, so it needs no extra inset.
  adaptive_icon_foreground_inset: 0
  adaptive_icon_background: "#1C1915"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon_monochrome.png"

flutter_native_splash:
  color: "#F4EFE4"
  color_dark: "#14120F"
  image: "assets/splash.png"
  android_12:
    image: "assets/icon_foreground.png"
    icon_background_color: "#1C1915"
    icon_background_color_dark: "#1C1915"
    color: "#F4EFE4"
    color_dark: "#14120F"
